<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KGF Admin - Messages</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="sidebar">

    <div class="logo">KGF<span>Admin</span></div>

    <ul>
        <li><a href="index.html">Dashboard</a></li>
        <li><a href="investors.html">Investors</a></li>
        <li><a href="transactions.html">Transactions</a></li>
        <li><a href="complaints.html">Complaints</a></li>
        <li><a href="messages.html" class="active">Messages</a></li>
        <li><a href="notifications.html">Notifications</a></li>
        <li><a href="settings.html">Settings</a></li>
    </ul>

    <button class="logout-btn" onclick="logout()">Logout</button>

</div>

<div class="main-content">

    <div class="topbar">
        <h1>Message Inbox</h1>

        <div class="admin-profile">
            🔔 Administrator
        </div>
    </div>

    <div class="inbox">

        <div class="inbox-panel">

            <div class="inbox-panel-header">
                <h2>Conversations</h2>
                <span class="result-count" id="conversationCount">0</span>
            </div>

            <div class="inbox-search">
                <input
                    type="text"
                    id="messageSearch"
                    placeholder="Search conversations..."
                    onkeyup="renderConversations()"
                >
            </div>

            <div class="conversation-list" id="conversationList"></div>

        </div>

        <div class="inbox-panel thread-panel">

            <div class="thread-header" id="threadHeader">

                <h2>Select a conversation</h2>
                <p>Choose a complaint thread from the list to read and reply.</p>

            </div>

            <div class="thread-messages" id="threadMessages"></div>

            <div class="composer">

                <textarea
                    id="replyText"
                    placeholder="Write a reply to the investor..."
                ></textarea>

                <div class="composer-actions">

                    <span class="composer-hint">Replies are sent as Administrator</span>

                    <button
                        class="primary-btn"
                        onclick="sendReply()"
                    >
                        Send Reply
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/investors.js"></script>
<script src="js/transactions.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/complaints.js"></script>
<script src="js/messages.js"></script>

</body>
</html>
